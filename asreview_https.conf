events {
  worker_connections        1024;
}

http {
  client_max_body_size      100M;
  proxy_cache_path          /var/cache/nginx/asreview keys_zone=asreview:20m max_size=500m;

  upstream asreview_container {
    server                  asreview:5006;
  }

  upstream oauth2_proxy {
    server                  oauth2-proxy:4180;
  }

  # Redirect HTTP → HTTPS
  server {
    listen                  [::]:80;
    listen                  80;
    return                  301 https://$http_host$request_uri;
  }

  # HTTPS
  server {
    listen                  [::]:443 ssl;
    listen                  443 ssl;
    http2                   on;

    ssl_certificate         /etc/pemfiles/fullchain.pem;
    ssl_certificate_key     /etc/pemfiles/privkey.pem;

    gzip                    on;
    gzip_http_version       1.0;
    gzip_comp_level         2;
    gzip_proxied            any;
    gzip_types              application/javascript;

    proxy_set_header        Host              $http_host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_cache_key         $scheme://$host$uri$is_args$query_string;

    # Static assets: served directly from ASReview, cached, no auth required.
    location = /favicon.ico {
      proxy_pass            http://asreview_container;
      proxy_cache           asreview;
      proxy_cache_valid     200 100d;
      proxy_ignore_headers  Cache-Control;
      add_header            X-Proxy-Cache $upstream_cache_status;
    }

    location ^~ /static {
      proxy_pass            http://asreview_container;
      proxy_cache           asreview;
      proxy_cache_valid     200 100d;
      proxy_ignore_headers  Cache-Control;
      add_header            X-Proxy-Cache $upstream_cache_status;
    }

    # oauth2-proxy's own endpoints: login, callback, sign-out, health.
    location /oauth2/ {
      proxy_pass            http://oauth2_proxy;
      proxy_buffer_size     128k;
      proxy_buffers         4 256k;
      proxy_busy_buffers_size 256k;
    }

    # Everything else flows through oauth2-proxy.
    # oauth2-proxy validates the Keycloak session, injects X-Auth-Request-*
    # headers, and proxies the request to the ASReview backend.
    # Unauthenticated requests are redirected to Keycloak automatically.
    location / {
      proxy_pass            http://oauth2_proxy;
      proxy_buffer_size     128k;
      proxy_buffers         4 256k;
      proxy_busy_buffers_size 256k;
    }
  }
}
