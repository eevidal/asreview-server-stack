## ============================================================
## oauth2-proxy — Keycloak OIDC configuration for Review Suite
## ============================================================
## Replace every CHANGE_ME / YOUR_* placeholder before starting.
## Generate the cookie secret with: openssl rand -base64 32

## ------------------------------------
## Provider: Keycloak (OIDC)
## ------------------------------------
provider = "oidc"

## The issuer URL is the Keycloak realm URL (no trailing slash).
## oauth2-proxy appends /.well-known/openid-configuration automatically.
oidc-issuer-url = "https://YOUR_KEYCLOAK_URL/realms/YOUR_REALM"

## Client credentials — create an "asreview" client in Keycloak:
##   Access type: confidential
##   Standard flow enabled: ON
##   Valid redirect URIs: https://YOUR_DOMAIN/oauth2/callback
client-id = "asreview"
client-secret = "CHANGE_ME"

## ------------------------------------
## Redirect & allowed domains
## ------------------------------------
redirect-url = "https://YOUR_DOMAIN/oauth2/callback"

## Allow users from any email domain (Keycloak itself controls who can log in).
## To restrict to a specific domain: email-domains = ["example.org"]
email-domains = ["*"]

## ------------------------------------
## Session cookie
## ------------------------------------
cookie-name    = "_oauth2_proxy"
cookie-secret  = "CHANGE_ME_RANDOM_32_BYTES_BASE64"
cookie-secure  = true
cookie-samesite = "lax"
cookie-expire  = "168h"    # 7 days; must be ≤ the Keycloak SSO session max

## ------------------------------------
## Server
## ------------------------------------
http-address = "0.0.0.0:4180"

## ------------------------------------
## Upstream: the ASReview backend
## ------------------------------------
upstreams = ["http://asreview:5006/"]

## ------------------------------------
## Header injection (read by ASReview's RemoteUserHandler)
## ------------------------------------
## pass-user-headers injects X-Auth-Request-* into the proxied request.
pass-user-headers = true
set-xauthrequest  = true

## Use the Keycloak email as the user identifier.
## ASReview stores users keyed by this value; it must be stable across logins.
user-id-claim = "email"

## Do NOT forward the Authorization header to the upstream app.
set-authorization-header  = false
pass-authorization-header = false

## Skip the intermediate "Sign in with…" page; redirect straight to Keycloak.
skip-provider-button = true

## Pass the original Host header to the upstream so ASReview URL-generation works.
pass-host-header = true
