services:

  database:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database-volume:/var/lib/postgresql/data

  asreview:
    build: .
    restart: always
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - project-folder:/project_folder
      - ./asreview_config.toml:/app/asreview_config.toml
    environment:
      - ASREVIEW_LAB_API_URL=/
      - ASREVIEW_LAB_CONFIG_PATH=/app/asreview_config.toml
      - ASREVIEW_LAB_SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    # Not exposed externally; oauth2-proxy and nginx reach this over the internal
    # Docker network (asreview:5006). Bound to localhost only for debugging.
    ports:
      - 127.0.0.1:${BACKEND_EXTERNAL_PORT}:5006

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: always
    depends_on:
      - asreview
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    command: --config /etc/oauth2-proxy.cfg
    # Internal only; nginx routes authenticated traffic through it

  server:
    image: nginx:1.27
    restart: always
    ports:
      - ${FRONTEND_EXTERNAL_PORT}:80
    volumes:
      - ./asreview.conf:/etc/nginx/nginx.conf
    depends_on:
      - oauth2-proxy
      - asreview

volumes:
  project-folder:
  database-volume:
